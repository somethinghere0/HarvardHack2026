server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # App backend (FastAPI scaffold).
    location /api/ {
        proxy_pass http://backend:8001/;
    }

    # Auth proxy: /auth/* plus everything forwarded to Nessie. The browser never sees the Nessie key.
    location /bank-api/ {
        proxy_pass http://proxy:8000/;
        proxy_set_header Host $host;
    }

    # Decoy phishing portal (the "scammer's" site the agent logs into).
    location /portal {
        proxy_pass http://portal:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
