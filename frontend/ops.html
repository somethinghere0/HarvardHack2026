<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>scamtracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23070b08'/><text x='16' y='23' font-size='20' font-family='monospace' font-weight='800' fill='%2335ff9e' text-anchor='middle'>_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --bg: #070b08; --bg-2: #0b110c; --panel: #0d140e; --panel-2: #0a0f0a;
      --grn: #35ff9e; --grn-dim: #3ad17a; --grn-soft: #7fe9ab; --grn-faint: rgba(53,255,158,.14);
      --txt: #9ff0b5; --txt-dim: #5c8a6e; --txt-faint: #3f5e4a;
      --red: #ff4d55; --red-dim: #c0303a; --amber: #ffd166;
      --line: rgba(53,255,158,.16); --line-2: rgba(53,255,158,.08);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      /* token names ops.js references inline — remapped to the dark palette */
      --muted: var(--txt-dim); --muted-2: var(--txt-faint); --ink: var(--txt); --card: var(--panel);
      --navy: var(--grn); --red-600: var(--red); --ok: var(--grn); --okbg: rgba(53,255,158,.12);
      --warn: var(--amber); --warnbg: rgba(255,209,102,.12); --errbg: rgba(255,77,85,.12);
      --shadow-sm: 0 0 0 1px var(--line-2); --shadow: 0 0 0 1px var(--line), 0 0 24px rgba(53,255,158,.05);
      --shadow-lg: 0 0 0 1px var(--grn-faint), 0 0 40px rgba(53,255,158,.1);
      --radius: 10px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--txt); font-family: var(--mono);
      font-size: 13px; line-height: 1.55;
      background-image:
        radial-gradient(120% 90% at 85% -10%, rgba(53,255,158,.06), transparent 55%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px); /* scanlines */
    }
    h1,h2,h3 { margin: 0; font-weight: 700; letter-spacing: .02em; }
    .muted { color: var(--txt-dim); } .tiny { font-size: 11px; } .mono { font-family: var(--mono); }
    .tnum { font-variant-numeric: tabular-nums; }
    ::selection { background: rgba(53,255,158,.3); color: #fff; }

    /* ---- top bar ---- */
    .topbar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
      padding: 0 18px; height: 54px; background: linear-gradient(180deg, #0a100b, #080c09);
      border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(53,255,158,.06);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; color: var(--grn);
      text-shadow: 0 0 12px rgba(53,255,158,.5); letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px;
      background: #0b140d; color: var(--grn); font-weight: 800; border: 1px solid var(--line);
      box-shadow: 0 0 14px rgba(53,255,158,.25); }
    .brand .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      padding: 4px 10px; border-radius: 4px; border: 1px solid var(--line); color: var(--grn);
      background: rgba(53,255,158,.07); }

    /* ---- layout ---- */
    .ops { max-width: 1240px; margin: 0 auto; padding: 20px 18px 70px; display: grid;
      grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }
    .status-strip { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .svc { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 4px; display: inline-flex;
      gap: 7px; align-items: center; border: 1px solid var(--line-2); background: var(--panel-2);
      text-transform: lowercase; letter-spacing: .02em; }
    .svc .dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .svc.live { color: var(--grn); } .svc.live .dot { background: var(--grn); }
    .svc.fake { color: var(--txt-faint); } .svc.fake .dot { background: var(--txt-faint); box-shadow: none; }
    .svc.local { color: var(--amber); } .svc.local .dot { background: var(--amber); }

    .group-head { display: flex; align-items: baseline; justify-content: space-between; }
    .group-head h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--grn-dim); }
    .group-head .group-sum { font-size: 11px; color: var(--txt-dim); }
    .inbox-wrap { grid-column: 1 / -1; }
    .ops-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 2px; }
    .ops-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--grn-dim); }
    .controls { display: flex; gap: 8px; }

    /* ---- buttons ---- */
    .btn { font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 5px;
      padding: 8px 14px; border: 1px solid var(--line); background: #0c130d; color: var(--grn);
      letter-spacing: .03em; transition: background .12s, box-shadow .12s, border-color .12s; }
    .btn:hover { background: rgba(53,255,158,.1); box-shadow: 0 0 16px rgba(53,255,158,.2); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-light { background: rgba(53,255,158,.12); }
    .btn-ghost { background: transparent; border-color: var(--line-2); color: var(--txt-dim); }
    .btn-ghost:hover { color: var(--grn); border-color: var(--line); }

    /* ---- inbox ---- */
    .inbox { display: grid; gap: 5px; }
    .msg { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center;
      background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--grn-dim);
      border-radius: 6px; padding: 8px 13px; text-align: left; font: inherit; width: 100%; cursor: default; }
    .msg.scam { border-left-color: var(--red); cursor: pointer; }
    .msg.scam:hover { background: rgba(255,77,85,.06); box-shadow: 0 0 16px rgba(255,77,85,.12); }
    .msg.safe:hover { background: rgba(53,255,158,.04); }
    .msg .vtag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .msg.safe .vtag { color: var(--grn); } .msg.scam .vtag { color: var(--red); }
    .msg .vtag::before { content: "["; } .msg .vtag::after { content: "]"; }
    .msg .msub { font-weight: 700; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg .mfrom { color: var(--txt-dim); font-size: 11px; }
    .msg .maction { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .msg.safe .maction { background: rgba(53,255,158,.12); color: var(--grn); }
    .msg.scam .maction { background: rgba(255,77,85,.14); color: var(--red); }

    /* ---- engagements list ---- */
    .eng-list { display: grid; gap: 8px; }
    .eng { text-align: left; font: inherit; color: var(--txt); cursor: pointer; width: 100%;
      background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--txt-faint);
      border-radius: 7px; padding: 11px 13px; display: grid; gap: 4px; }
    .eng:hover { box-shadow: 0 0 18px rgba(53,255,158,.08); }
    .eng.sel { border-color: var(--grn); border-left-color: var(--grn); box-shadow: 0 0 20px rgba(53,255,158,.14); }
    .eng.drained { border-left-color: var(--red); } .eng.active { border-left-color: var(--amber); }
    .eng.baited { border-left-color: var(--grn-dim); }
    .eng-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .eng-sub { font-weight: 700; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .risk { font-weight: 800; font-variant-numeric: tabular-nums; }
    .risk-hi { color: var(--red); text-shadow: 0 0 12px rgba(255,77,85,.5); }
    .risk-md { color: var(--amber); } .risk-lo { color: var(--txt-dim); }
    .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: 3px 8px; border-radius: 4px; background: rgba(53,255,158,.08); color: var(--grn-dim);
      border: 1px solid var(--line-2); }
    .pill.danger { background: rgba(255,77,85,.1); color: var(--red); border-color: rgba(255,77,85,.25); }

    /* ---- detail panel ---- */
    .panel { display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 18px;
      box-shadow: var(--shadow); }
    .card h2, .card h3 { color: var(--grn); }
    .empty-panel { color: var(--txt-dim); padding: 60px 20px; text-align: center; }
    .empty-panel::before { content: "> "; color: var(--grn); }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 12px; }
    .kv dt { color: var(--txt-dim); text-transform: lowercase; } .kv dt::after { content: ":"; }
    .kv dd { margin: 0; font-weight: 600; color: var(--txt); word-break: break-all; }
    .bars { display: grid; gap: 8px; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
    .bar .track { grid-column: 1 / -1; height: 6px; background: rgba(255,255,255,.05); border-radius: 99px; overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(90deg, var(--grn), var(--red)); box-shadow: 0 0 10px rgba(255,77,85,.4); }
    .tl { list-style: none; margin: 0; padding: 0; display: grid; }
    .tl li { display: grid; grid-template-columns: 90px 110px 1fr; gap: 10px; padding: 7px 2px;
      border-bottom: 1px solid var(--line-2); font-size: 12px; }
    .tl .t { color: var(--txt-faint); font-variant-numeric: tabular-nums; }
    .tl .src { font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; color: var(--grn-dim); }
    .tl .src::before { content: "["; } .tl .src::after { content: "]"; }
    .filmstrip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .shot { margin: 0; flex: 0 0 auto; width: 250px; }
    .shot img { width: 250px; border: 1px solid var(--line); border-radius: 6px; display: block;
      box-shadow: 0 0 16px rgba(53,255,158,.08); }
    .shot figcaption { font-size: 10.5px; color: var(--txt-dim); margin-top: 5px; }
    .shot figcaption::before { content: "» "; color: var(--grn-dim); }

    @media (max-width: 820px) { .ops { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">▓</span><span>scamtracker<span class="blink">_</span></span></div>
    <div class="topbar-right"><span class="badge" id="count">0 engagements</span></div>
  </header>
  <main class="ops">
    <div class="status-strip" id="status"></div>
    <div class="inbox-wrap">
      <div class="group-head" style="margin:4px 2px 8px"><h3>// inbound · every email vetted</h3><span class="group-sum" id="inbox-count"></span></div>
      <div class="inbox" id="inbox"></div>
    </div>
    <div class="ops-head">
      <h2>// active engagements</h2>
      <div class="controls">
        <button class="btn btn-light" id="sim">./simulate --drain</button>
        <button class="btn btn-ghost" id="refresh">refresh</button>
      </div>
    </div>
    <div class="eng-list" id="list"></div>
    <div class="card panel" id="panel"><div class="empty-panel">select a target to trace its timeline and indicators</div></div>
  </main>
  <script type="module" src="js/ops.js"></script>
</body>
</html>
