<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Honeybank — Fraud Monitor</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .ops { max-width: 1180px; margin: 0 auto; padding: 24px 18px 60px; display: grid;
      grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .ops-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .ops-head h1 { font-size: 22px; }
    .eng-list { display: grid; gap: 10px; }
    .eng { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%;
      background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--muted-2);
      border-radius: 12px; box-shadow: var(--shadow-sm); padding: 13px 15px; display: grid; gap: 4px; }
    .eng:hover { box-shadow: var(--shadow); }
    .eng.sel { border-color: var(--navy); border-left-color: var(--navy); }
    .eng.drained { border-left-color: var(--red); }
    .eng.active { border-left-color: var(--warn); }
    .eng-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .eng-sub { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .risk { font-weight: 800; font-variant-numeric: tabular-nums; }
    .risk-hi { color: var(--red-600); } .risk-md { color: var(--warn); } .risk-lo { color: var(--muted); }
    .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .pill { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      padding: 3px 8px; border-radius: 999px; background: #eef1f6; color: var(--navy); }
    .pill.danger { background: var(--errbg); color: var(--red-600); }
    .panel { display: grid; gap: 16px; }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; word-break: break-all; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
    .tl li { display: grid; grid-template-columns: 150px 120px 1fr; gap: 10px; padding: 9px 4px;
      border-bottom: 1px solid var(--line-2); font-size: 13px; }
    .tl .t { color: var(--muted); font-variant-numeric: tabular-nums; }
    .tl .src { font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; color: var(--navy); }
    .bars { display: grid; gap: 8px; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
    .bar .track { grid-column: 1 / -1; height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .bar .fill { height: 100%; background: var(--red); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .empty-panel { color: var(--muted); padding: 60px 20px; text-align: center; }
    @media (max-width: 820px) { .ops { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">H</span><span>Honeybank · Fraud Monitor</span></div>
    <div class="topbar-right"><span class="badge badge-live" id="count">0 engagements</span></div></header>
  <main class="ops">
    <div class="ops-head">
      <h2 style="font-size:16px">Engagements</h2>
      <div class="controls">
        <button class="btn btn-light" id="sim">Simulate scam + drain</button>
        <button class="btn btn-ghost" id="refresh">Refresh</button>
      </div>
    </div>
    <div class="eng-list" id="list"></div>
    <div class="card panel" id="panel"><div class="empty-panel">Select an engagement to see its timeline and indicators.</div></div>
  </main>
  <script type="module" src="js/ops.js"></script>
</body>
</html>
