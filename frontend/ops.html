<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>scamtracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23070b08'/><text x='16' y='23' font-size='20' font-family='monospace' font-weight='800' fill='%2335ff9e' text-anchor='middle'>_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <style>
    :root {
      --bg: #0a0a0a; --bg-2: #0f0f0f; --panel: #121212; --panel-2: #0e0e0e;
      --grn: #3ddc84; --grn-dim: #34b872; --grn-soft: #8fdcb2; --grn-faint: rgba(61,220,132,.12);
      --txt: #e6e6e6; --txt-dim: #8c8c8c; --txt-faint: #5a5a5a;
      --red: #ff5a5f; --red-dim: #c0303a; --amber: #f5c451;
      --line: #2b2b2b; --line-2: #1f1f1f;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      /* token names ops.js references inline — remapped to the dark palette */
      --muted: var(--txt-dim); --muted-2: var(--txt-faint); --ink: var(--txt); --card: var(--panel);
      --navy: var(--grn); --red-600: var(--red); --ok: var(--grn); --okbg: rgba(61,220,132,.1);
      --warn: var(--amber); --warnbg: rgba(245,196,81,.1); --errbg: rgba(255,90,95,.1);
      --shadow-sm: none; --shadow: none; --shadow-lg: none;
      --radius: 10px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--txt); font-family: var(--mono);
      font-size: 13px; line-height: 1.55;
    }
    h1,h2,h3 { margin: 0; font-weight: 700; letter-spacing: .02em; }
    .muted { color: var(--txt-dim); } .tiny { font-size: 11px; } .mono { font-family: var(--mono); }
    .tnum { font-variant-numeric: tabular-nums; }
    ::selection { background: rgba(61,220,132,.3); color: #fff; }

    /* ---- top bar ---- */
    .topbar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
      padding: 0 18px; height: 54px; background: #0a0a0a;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; color: var(--grn);
      letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px;
      color: var(--grn); font-weight: 800; font-size: 12px; border: 1px solid var(--line); }
    .brand .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      padding: 4px 10px; border-radius: 4px; border: 1px solid var(--line); color: var(--grn);
      background: rgba(255,255,255,.06); }

    /* ---- layout ---- */
    html { scroll-behavior: smooth; }
    .ops { padding: 16px 24px 80px; display: grid; gap: 16px; }
    .ops[hidden] { display: none; }
    .status-strip { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .deck { display: grid; max-height: calc(100vh - 54px - 80px); min-height: 240px; }
    .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; }
    .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .pane-head h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--grn-dim); white-space: nowrap; }
    .pane-head #inbox-count { flex: 1; }
    .pane-body { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }
    .verdict { margin: 0; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel-2); }
    .verdict.scam { border-color: rgba(255,77,85,.3); background: rgba(255,77,85,.06); }
    .verdict .vh { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 12px; }
    .verdict.scam .vh { color: var(--red); } .verdict.safe .vh { color: var(--grn); }
    .verdict.pending .vh, .verdict.review .vh { color: var(--amber); }
    .verdict p { margin: 6px 0 0; font-size: 11.5px; color: var(--txt-dim); }
    .detail { scroll-margin-top: 70px; min-height: calc(100vh - 54px - 32px); }
    .detail[hidden] { display: none; }
    .detail.enter { animation: rise .55s cubic-bezier(.2,.8,.2,1); }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .msg.enter { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .svc { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 4px; display: inline-flex;
      gap: 7px; align-items: center; border: 1px solid var(--line-2); background: var(--panel-2);
      text-transform: lowercase; letter-spacing: .02em; }
    .svc .mark { font-weight: 800; }
    .svc.live { color: var(--grn); }
    .svc.fake { color: var(--txt-faint); }
    .svc.local { color: var(--amber); }

    .group-head { display: flex; align-items: baseline; justify-content: space-between; }
    .group-head h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--grn-dim); }
    .group-head .group-sum { font-size: 11px; color: var(--txt-dim); }
    .inbox-wrap { grid-column: 1 / -1; }
    .ops-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 2px; }
    .ops-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--grn-dim); }
    .controls { display: flex; gap: 8px; }

    /* ---- buttons ---- */
    .btn { font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 5px;
      padding: 8px 14px; border: 1px solid var(--line); background: #141414; color: var(--grn);
      letter-spacing: .03em; transition: background .12s, box-shadow .12s, border-color .12s; }
    .btn:hover { background: rgba(255,255,255,.06); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-light { background: rgba(255,255,255,.04); }
    .btn-ghost { background: transparent; border-color: var(--line-2); color: var(--txt-dim); }
    .btn-ghost:hover { color: var(--grn); border-color: var(--line); }

    /* ---- inbox ---- */
    .inbox { display: grid; gap: 5px; }
    .msg { display: grid; grid-template-columns: 70px 1fr auto auto; gap: 12px; align-items: center; color: var(--txt);
      background: var(--panel-2); border: 1px solid var(--line-2);
      border-radius: 8px; padding: 10px 14px; text-align: left; font: inherit; width: 100%; cursor: pointer;
      transition: background .15s, box-shadow .15s, border-color .15s, transform .15s; }
    .msg:hover { transform: translateX(3px); }
    .msg.scam:hover { background: rgba(255,77,85,.06); border-color: rgba(255,77,85,.3); }
    .msg.safe:hover { background: rgba(255,255,255,.06); border-color: var(--line); }
    .msg.sel { border-color: var(--grn); background: rgba(255,255,255,.06); }
    .msg.scam.sel { border-color: var(--red); background: rgba(255,77,85,.08); }
    .msg .vtag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .msg.safe .vtag { color: var(--grn); } .msg.scam .vtag { color: var(--red); }
    .msg.pending .vtag, .msg.review .vtag { color: var(--amber); }
    .msg.pending .vtag { animation: pulse 1.6s ease-in-out infinite; }
    .msg .vtag::before { content: "["; } .msg .vtag::after { content: "]"; }
    .msg .msub { font-weight: 700; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg .mfrom { color: var(--txt-dim); font-size: 11px; }
    .msg .mstate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--txt-dim); }
    .msg .risk { font-size: 15px; min-width: 28px; text-align: right; }
    .msg .maction { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .msg.safe .maction { background: rgba(255,255,255,.04); color: var(--grn); }
    .msg.scam .maction { background: rgba(255,77,85,.14); color: var(--red); }
    .msg.pending .maction, .msg.review .maction { background: rgba(255,255,255,.04); color: var(--amber); }

    /* ---- status dots + risk + pills (used inside inbox rows) ---- */
    .sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--txt-faint); }
    .sdot.active { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
    .sdot.drained, .sdot.compromised { background: var(--red); }
    .sdot.detonating { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
    .sdot.cleared { background: var(--grn); }
    .sdot.baited { background: var(--grn-dim); }
    @keyframes pulse { 50% { opacity: .35; } }
    .risk { font-weight: 800; font-variant-numeric: tabular-nums; }
    .risk-hi { color: var(--red); }
    .risk-md { color: var(--amber); } .risk-lo { color: var(--txt-dim); }
    .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,.06); color: var(--grn-dim);
      border: 1px solid var(--line-2); }
    .pill.danger { background: rgba(255,77,85,.1); color: var(--red); border-color: rgba(255,77,85,.25); }

    /* ---- detail panel ---- */
    .panel { display: grid; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 18px; }
    .card h2, .card h3 { color: #fff; }
    .empty-panel { color: var(--txt-dim); padding: 60px 20px; text-align: center; }
    .empty-panel::before { content: "> "; color: var(--grn); }
    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 12px; }
    .kv dt { color: var(--txt-dim); text-transform: lowercase; } .kv dt::after { content: ":"; }
    .kv dd { margin: 0; font-weight: 600; color: var(--txt); word-break: break-all; }
    .bars { display: grid; gap: 8px; }
    .bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
    .bar .track { grid-column: 1 / -1; height: 6px; background: rgba(255,255,255,.05); border-radius: 99px; overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(90deg, var(--grn), var(--red)); }
    .tl { list-style: none; margin: 0; padding: 0; display: grid; }
    .tl li { display: grid; grid-template-columns: 90px 110px 1fr; gap: 10px; padding: 7px 2px;
      border-bottom: 1px solid var(--line-2); font-size: 12px; }
    .tl .t { color: var(--txt-faint); font-variant-numeric: tabular-nums; }
    .tl .src { font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; color: var(--grn-dim); }
    .tl .src::before { content: "["; } .tl .src::after { content: "]"; }
    .filmstrip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .shot { margin: 0; flex: 0 0 auto; width: 250px; }
    .shot img { width: 250px; border: 1px solid var(--line); border-radius: 6px; display: block; }
    .shot figcaption { font-size: 10.5px; color: var(--txt-dim); margin-top: 5px; }
    .shot figcaption::before { content: "» "; color: var(--grn-dim); }

    /* ---- daytona sandbox viewer ---- */
    .sandbox { border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
      background: #0b0b0b; }
    .sandbox.run { }
    .sb-bar { display: flex; align-items: center; gap: 12px; padding: 8px 13px;
      background: #121212; border-bottom: 1px solid var(--line); }
    .c-dots { display: inline-flex; gap: 6px; } .c-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .c-dots i:nth-child(1) { background: #ff5f57; } .c-dots i:nth-child(2) { background: #febc2e; } .c-dots i:nth-child(3) { background: #28c840; }
    .sb-title { font-size: 12px; color: var(--grn-soft); letter-spacing: .03em; }
    .sb-state { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--txt-dim); display: inline-flex; align-items: center; gap: 8px; }
    .sandbox.run .sb-state { color: var(--grn); }
    .sb-load { width: 54px; height: 4px; border-radius: 999px; background: rgba(40,200,64,.18); overflow: hidden; position: relative; }
    .sb-load::after { content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 40%; border-radius: 999px;
      background: var(--grn); box-shadow: 0 0 8px var(--grn); animation: sbload 1.3s ease-in-out infinite; }
    @keyframes sbload { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    .sandbox.err .sb-state { color: var(--red); }
    .sb-body { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.5fr); height: 520px; }
    .sb-term { background: #080808; padding: 12px 14px; overflow-y: auto; min-height: 0;
      font-size: 12px; line-height: 1.7; border-right: 1px solid var(--line); }
    .sb-term .ln { white-space: pre-wrap; word-break: break-word; color: var(--txt); }
    .sb-term .ln.dim { color: var(--txt-faint); } .sb-term .ln.ok { color: var(--grn); }
    .sb-term .ln.err { color: var(--red); } .sb-term .ln.cmd { color: var(--grn-dim); }
    .sb-term .lt { display: inline-block; width: 66px; color: var(--txt-faint); user-select: none; }
    .sb-view { display: flex; flex-direction: column; background: #0e0e0e; min-width: 0; min-height: 0; overflow: hidden; }
    .sb-chrome { display: flex; align-items: center; gap: 10px; padding: 7px 11px; border-bottom: 1px solid var(--line-2); }
    .sb-chrome .c-dots i { width: 8px; height: 8px; }
    .c-url { flex: 1; font-size: 11px; color: var(--txt-dim); background: #161616; border: 1px solid var(--line-2);
      border-radius: 5px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-url::before { content: "🔒 "; filter: grayscale(1) opacity(.6); }
    .sb-screen { width: 100%; flex: 1; transition: opacity .25s; object-fit: cover; object-position: top; display: block; min-height: 0; background: #fff; }
    .sb-boot { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--grn-dim); font-size: 12px; }
    .spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--grn); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) { .sb-body { grid-template-columns: 1fr; } .sb-term { border-right: 0; border-bottom: 1px solid var(--line); } }


    /* ---- terminal inspector ---- */
    .sb-term .ln.click { cursor: pointer; border-radius: 4px; margin: 0 -6px; padding: 0 6px; transition: background .12s; }
    .sb-term .ln.click:hover { background: rgba(255,255,255,.06); }
    .sb-term .ln.on { background: rgba(61,220,132,.12); }
    .sb-hint { padding: 9px 14px; font-size: 11px; color: var(--txt-faint); border-top: 1px solid var(--line-2); background: #0b0b0b; }
    .sb-inspect { border-top: 1px solid var(--line); background: #0c0c0c; animation: rise .3s cubic-bezier(.2,.8,.2,1); }
    .insp-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line-2); }
    .insp-head b { color: var(--grn); } .insp-head .src { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--grn-dim); }
    .insp-head .src::before { content: "["; } .insp-head .src::after { content: "]"; }
    .insp-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; padding: 12px 14px; max-height: 360px; overflow-y: auto; }
    .insp-col { display: grid; gap: 5px; align-content: start; min-width: 0; font-size: 12px; }
    .insp-col h4 { margin: 0 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--grn-dim); }
    .insp-k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--txt-faint); margin-top: 6px; }
    .insp-pre { margin: 0; padding: 9px 10px; background: #080808; border: 1px solid var(--line-2); border-radius: 6px; font: inherit; font-size: 11px;
      color: var(--txt); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chips .pill { text-transform: none; }

    /* ---- data tables ---- */
    .dt { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dt th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--txt-dim); font-weight: 700;
      padding: 7px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
    .dt td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; word-break: break-word; }
    .dt tr.row { cursor: pointer; transition: background .12s; } .dt tr.row:hover td { background: rgba(255,255,255,.06); }
    .dt .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dt .in { color: var(--grn); } .dt .out { color: var(--red); }

    /* ---- view tabs ---- */
    .views { display: flex; gap: 2px; margin-left: 20px; }
    .vtab { font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .02em; cursor: pointer; color: var(--txt-dim);
      background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; text-transform: lowercase; }
    .vtab:hover { color: var(--grn); } .vtab.on { color: var(--grn); background: var(--panel); border-color: var(--line); }

    /* ---- swarm view ---- */
    .swarm-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .swarm-title { font-size: 20px; color: #fff; }
    .swarm-head .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ctl { font-size: 11px; color: var(--txt-dim); display: inline-flex; align-items: center; gap: 6px; }
    .ctl input[type=number] { width: 52px; font: inherit; font-size: 12px; background: var(--panel-2); color: var(--txt);
      border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; }
    .ctl input[type=checkbox] { accent-color: var(--grn); }
    .sw-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--txt-dim); margin: 2px 0 10px; }
    .sw-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
    .sw-grid { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 18px; min-height: 40px; align-content: flex-start; }
    .cell { width: 11px; height: 11px; border-radius: 2px; background: var(--line); cursor: pointer; transition: background .2s, transform .1s; }
    .cell:hover { transform: scale(1.5); }
    .cell.booting { background: #3a3a3a; } .cell.analyzing { background: var(--amber); }
    .cell.done { background: var(--grn-dim); } .cell.error { background: var(--red-dim); }
    .cell.base.done { background: #2b2b2b; outline: 1px solid var(--line); }
    .cell.sel { outline: 2px solid var(--grn); outline-offset: 1px; }
    .sw-cols { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 16px; }
    .srow { display: grid; grid-template-columns: 170px 1fr 92px; gap: 10px; align-items: center; font-size: 12px; padding: 5px 0; }
    .srow .sname { text-transform: lowercase; }
    .sbar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
    .sbar i { display: block; height: 100%; background: var(--grn); }
    .srow .snum { text-align: right; font-variant-numeric: tabular-nums; color: var(--txt-dim); }
    .srow.base .sbar i { background: var(--txt-faint); }
    .sw-log { font-family: var(--mono); font-size: 11px; line-height: 1.85; max-height: 260px; overflow-y: auto; }
    .sw-log .lg { color: var(--txt-dim); } .sw-log .lg b { color: var(--grn-dim); font-weight: 700; }
    .sw-log .lg .er { color: var(--red); }
    .sw-log .lg .mono { color: var(--txt); }

    /* ---- run story ---- */    /* ---- run story ---- */
    .story { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); overflow: hidden; }
    .story-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .stage { font: inherit; color: var(--txt-faint); text-align: left; cursor: pointer; background: transparent; border: 0;
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 14px;
      display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 2px 10px; transition: background .15s, color .15s; }
    .stage:last-child { border-right: 0; }
    .stage:hover { background: rgba(255,255,255,.04); }
    .stage .st-n { grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center;
      font-size: 11px; font-weight: 800; }
    .stage .st-txt { display: grid; min-width: 0; } .stage .st-txt b { font-size: 12px; color: inherit; }
    .stage .st-txt span { font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--txt-faint); }
    .stage .st-t { font-size: 10px; color: var(--txt-faint); grid-column: 2; }
    .stage.done { color: var(--txt); } .stage.done .st-n { color: var(--grn); border-color: var(--grn); }
    .stage.now { color: var(--txt); } .stage.now .st-n { color: var(--amber); border-color: var(--amber); animation: blink 1.2s steps(1) infinite; }
    .stage.open { background: var(--panel); border-bottom-color: transparent; }
    .stage.open .st-txt b { color: var(--grn); }
    .story-note { padding: 14px 18px; font-size: 12px; } .story-note p { margin: 6px 0 0; }

    .mail { margin: 14px; border: 1px solid var(--line); border-radius: 10px; background: #f6f8fc; color: #1f1f1f;
      font-family: "Google Sans", Roboto, -apple-system, "Segoe UI", sans-serif; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
    .mail-top { display: flex; align-items: center; gap: 12px; padding: 14px 18px 4px; flex-wrap: wrap; }
    .mail-av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #5f6368; color: #fff; font-weight: 600; flex: none; }
    .mail.scam .mail-av { background: #d93025; } .mail.otp .mail-av { background: #1a73e8; }
    .mail-from { display: grid; flex: 1; min-width: 200px; } .mail-from b { font-size: 14px; color: #1f1f1f; }
    .mail-from .muted { color: #5f6368; }
    .mail .muted { color: #5f6368; }
    .mail-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px; }
    .mail-tag.scam { background: #fce8e6; color: #c5221f; } .mail-tag.otp { background: #e8f0fe; color: #1967d2; }
    .mail-subj { font-size: 20px; padding: 8px 18px 4px 64px; color: #1f1f1f; }
    .mail-body { padding: 8px 18px 18px 64px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #3c4043; }
    .mail-link { color: #1a0dab; text-decoration: underline; word-break: break-all; }
    @media (max-width: 1100px) { .story-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* ---- detail layout ---- */
    .d-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .d-title { flex: 1; min-width: 240px; display: grid; gap: 6px; }
    .d-title h2 { font-size: 22px; color: #fff; }
    .alert-kicker { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
    .alert-kicker::before { content: "● "; animation: blink 1.2s steps(1) infinite; }
    .gauge { --v: 0; width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: conic-gradient(var(--gc, var(--grn)) calc(var(--v) * 1%), rgba(255,255,255,.06) 0); }
    .gauge > div { width: 70px; height: 70px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; text-align: center; line-height: 1.1; }
    .gauge b { font-size: 22px; } .gauge span { font-size: 9px; color: var(--txt-dim); letter-spacing: .1em; text-transform: uppercase; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
    .stat { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 11px 13px; transition: border-color .15s; }
    .stat:hover { border-color: var(--line); }
    .stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--txt-dim); }
    .stat .v { font-size: 18px; font-weight: 800; color: var(--grn); font-variant-numeric: tabular-nums; }
    .d-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; align-items: start; }
    .d-grid .card { height: 100%; }
    .tl-wrap { max-height: 340px; overflow-y: auto; }
    .tl li { transition: background .12s; } .tl li:hover { background: rgba(255,255,255,.06); }
    .sb-boot { flex-direction: column; gap: 14px;  }
    .stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 12px; }
    .stages li { color: var(--txt-faint); } .stages li.done { color: var(--grn-dim); } .stages li.now { color: var(--grn); }
    .stages li::before { content: "○ "; } .stages li.done::before { content: "✓ "; } .stages li.now::before { content: "◌ "; }
    .sb-fail { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      padding: 24px; text-align: center; color: var(--red);  }
    .sb-fail b { font-size: 14px; } .sb-fail p { margin: 0; max-width: 460px; font-size: 11.5px; color: var(--txt-dim); word-break: break-word; }
    .frames { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; border-top: 1px solid var(--line-2); background: #0b0b0b; }
    .frames button { flex: none; padding: 0; border: 1px solid var(--line-2); border-radius: 4px; cursor: pointer; background: none; opacity: .55; transition: opacity .15s, border-color .15s, transform .15s; }
    .frames button:hover { opacity: 1; transform: translateY(-2px); }
    .frames button.on { opacity: 1; border-color: var(--grn); }
    .frames img { width: 72px; height: 48px; object-fit: cover; object-position: top; display: block; border-radius: 3px; }
    @media (max-width: 1100px) { .d-grid { grid-template-columns: 1fr 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 820px) { .msg { grid-template-columns: 60px 1fr auto; } .msg .maction { display: none; } .d-grid { grid-template-columns: 1fr; } .sb-body { height: auto; } }

  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">&gt;_</span><span>scamtracker<span class="blink">_</span></span></div>
    <nav class="views">
      <button class="vtab on" data-view="monitor">inbox monitor</button>
      <button class="vtab" data-view="swarm">scenario swarm</button>
    </nav>
    <div class="topbar-right"><span class="badge" id="count">0 engagements</span></div>
  </header>
  <main class="ops" id="view-monitor">
    <div class="status-strip" id="status"></div>
    <section class="deck" id="deck">
      <div class="pane">
        <div class="pane-head">
          <h3>// inbound · every email detonated</h3>
          <span class="tiny muted" id="inbox-count"></span>
          <div class="controls">
            <button class="btn btn-light" id="sim">./simulate --drain</button>
            <button class="btn btn-ghost" id="refresh">refresh</button>
          </div>
        </div>
        <div class="pane-body"><div class="inbox" id="inbox"></div></div>
      </div>
    </section>
    <div id="verdict"></div>
    <section class="card detail" id="panel" hidden></section>
  </main>
  <main class="ops" id="view-swarm" hidden>
    <div class="swarm-head">
      <div>
        <h2 class="swarm-title">scenario swarm</h2>
        <p class="muted tiny" id="swarm-sub">Nessie plants one scam type per bank; every customer is analyzed in its own Daytona sandbox (this tier runs ~8–10 at a time, so cases queue through that window).</p>
      </div>
      <div class="controls">
        <label class="ctl">customers/type <input id="sw-cust" type="number" value="40" min="1" max="200"></label>
        <label class="ctl">anomaly % <input id="sw-rate" type="number" value="18" min="0" max="100"></label>
        <label class="ctl">concurrency <input id="sw-conc" type="number" value="8" min="1" max="64"></label>
        <label class="ctl"><input id="sw-claude" type="checkbox" checked> claude on borderline</label>
        <button class="btn btn-light" id="sw-run">launch swarm</button>
      </div>
    </div>
    <div class="stats" id="sw-stats"></div>
    <div class="sw-legend" id="sw-legend"></div>
    <div class="sw-grid" id="sw-grid"></div>
    <div class="sw-cols">
      <div class="card"><h3 style="font-size:13px;margin-bottom:10px">detection by scam type</h3><div id="sw-score"></div></div>
      <div class="card"><h3 style="font-size:13px;margin-bottom:10px">Nessie API, live</h3><div class="sw-log" id="sw-log"></div></div>
    </div>
    <div class="card" id="sw-caseview" hidden></div>
  </main>
  <script type="module" src="js/ops.js"></script>
</body>
</html>
