services:
  proxy:
    build: ./proxy
    env_file: ./.env
    environment:
      DB_PATH: /data/proxy.db
      ORCHESTRATOR_URL: http://backend:8001
      OTP_REQUIRED: "1"
      ENFORCE_CUSTOMER_SCOPE: "1"
    volumes:
      - proxy-data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./.env
    environment:
      ORCH_DB_PATH: /data/orchestrator.db
      PROXY_URL: http://proxy:8000
    volumes:
      - orch-data:/data
    depends_on:
      proxy:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
      proxy:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

  # Public URL for Nessie webhooks, the scammer-facing bank, and the sandboxed agent. Set
  # CLOUDFLARE_TUNNEL_TOKEN in .env and PUBLIC_URL to the tunnel hostname, then uncomment.
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on: [frontend]
  #   restart: unless-stopped

volumes:
  proxy-data:
  orch-data:
